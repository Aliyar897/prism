    points="13,9 14.3,14.7 20,16 14.3,17.3 13,23 11.7,17.3 6,16 11.7,14.7"/>

  <!-- Small 4-pointed star — centre (23, 9), outer r=3, inner r=0.8 -->
  <polygon fill="white" opacity="0.9"
    points="23,6 23.6,8.4 26,9 23.6,9.6 23,12 22.4,9.6 20,9 22.4,8.4"/>

  <!-- Small 4-pointed star — centre (23, 23), outer r=3, inner r=0.8 -->
