<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#635BFF"/>

  <!-- Large 4-pointed star — centre (13, 16), outer r=7, inner r=1.8 -->
