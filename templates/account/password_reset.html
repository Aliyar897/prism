{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism — Reset Password</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --text: #1A1814;
      --text-2: #6B6760;
      --accent: #5B47E0;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .card {
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-2);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      font-size: 13px;
      color: var(--text-2);
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #4a38c8;
    }

    .back {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
    }

    .back a {
      color: var(--accent);
      text-decoration: none;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <div class="logo-mark"></div>
      Prism
    </div>

    <h1>Reset your password</h1>
    <p>Enter your email and we’ll send you a reset link.</p>

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="btn">
        Send reset link
      </button>
    </form>

    <div class="back">
      <a href="{% url 'account_login' %}">← Back to login</a>
    </div>

  </div>

</body>
</html>
