{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism — Email Sent</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --text: #1A1814;
      --text-2: #6B6760;
      --accent: #5B47E0;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .card {
      width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(91,71,224,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 28px;
      color: var(--accent);
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .note {
      font-size: 12px;
      color: var(--text-2);
      background: #F0EEFF;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
    }

    .btn:hover {
      background: #4a38c8;
    }

    .link {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="icon">✉️</div>

    <h1>Email sent</h1>

    <p>
      We’ve sent a password reset link to your email address.
      Please check your inbox and follow the instructions.
    </p>

    <div class="note">
      Didn’t receive it? Check your spam folder or wait a few minutes.
    </div>

    <a href="{% url 'account_login' %}" class="btn">
      Back to Sign In
    </a>

    <a href="{% url 'account_reset_password' %}" class="link">
      Try again
    </a>

  </div>

</body>
</html>
