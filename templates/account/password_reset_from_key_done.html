{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism — Password Updated</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --text: #1A1814;
      --text-2: #6B6760;
      --accent: #5B47E0;
      --green: #1A9E75;
      --green-light: #E4F5EE;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .card {
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-weight: 600;
      justify-content: center;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
    }

    .success-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-size: 24px;
      margin: 0 auto 18px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      color: var(--text-2);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #4a38c8;
    }

    .back {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
    }

    .back a {
      color: var(--accent);
      text-decoration: none;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <div class="logo-mark"></div>
      Prism
    </div>

    <div class="success-icon">✓</div>

    <h1>Password updated</h1>

    <p>
      Your password has been changed successfully.<br>
      You can now sign in using your new password.
    </p>

    <a href="{% url 'account_login' %}" class="btn">
      Continue to sign in
    </a>

    <div class="back">
      <a href="{% url 'account_login' %}">← Back to login</a>
    </div>

  </div>

</body>
</html>
